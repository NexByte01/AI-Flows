[pytest]
# Run from `mcp-server/`: `pytest`
# Run from repo root:           `pytest projects/paper-patent-assistant/skills/nature-academic-search/mcp-server`
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
