name: Repository Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    env:
      PR_HEAD_REF: ${{ github.head_ref }}
      PUSH_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check branch naming convention
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="$PR_HEAD_REF"
          else
            BRANCH="$PUSH_REF_NAME"
          fi

          PATTERN='^(feature|fix|docs|chore)\/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected format: feature/<name>, fix/<name>, docs/<name>, chore/<name>"
            exit 1
          fi

  commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commit messages
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            COMMITS=$(git log --format=%s -n 20 "$HEAD_SHA")
          else
            COMMITS=$(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          fi

          if [[ -z "$COMMITS" ]]; then
            echo "No commit messages found to validate."
            exit 0
          fi

          PATTERN='^(feat|fix|docs|chore|refactor|perf|style)(\([a-z0-9._/-]+\))?: .+'

          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if [[ ! "$subject" =~ $PATTERN ]]; then
              echo "Invalid commit message: $subject"
              echo "Expected Conventional Commits format, e.g. docs(readme): update project overview"
              exit 1
            fi
          done <<< "$COMMITS"

  required-files:
    name: Check Required Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify key repository files exist
        shell: bash
        run: |
          for path in AGENTS.md MEMORY.md memory/tasks.md CONTRIBUTING.md README.md; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required file: $path"
              exit 1
            fi
          done

  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile backend Python files
        shell: bash
        run: |
          python -m py_compile media-platform/backend/app.py media-platform/backend/db.py media-platform/backend/processors.py

  actionlint:
    name: Workflow Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.10

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    needs:
      - branch-name
      - commit-messages
      - required-files
      - python-syntax
      - actionlint
    if: ${{ always() }}
    steps:
      - name: Verify upstream checks passed
        shell: bash
        env:
          BRANCH_NAME_RESULT: ${{ needs.branch-name.result }}
          COMMIT_MESSAGES_RESULT: ${{ needs.commit-messages.result }}
          REQUIRED_FILES_RESULT: ${{ needs.required-files.result }}
          PYTHON_SYNTAX_RESULT: ${{ needs.python-syntax.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          FAILED=0

          for item in \
            "Validate Branch Name:$BRANCH_NAME_RESULT" \
            "Validate Commit Messages:$COMMIT_MESSAGES_RESULT" \
            "Check Required Files:$REQUIRED_FILES_RESULT" \
            "Python Syntax Check:$PYTHON_SYNTAX_RESULT" \
            "Workflow Static Check:$ACTIONLINT_RESULT"
          do
            NAME="${item%%:*}"
            RESULT="${item#*:}"

            if [[ "$RESULT" != "success" ]]; then
              echo "$NAME did not succeed: $RESULT"
              FAILED=1
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

          echo "All repository checks passed."
