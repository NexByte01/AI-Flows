name: Auto Create Draft PR

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create draft PR if missing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const base = context.payload.repository.default_branch || 'main';

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base,
              per_page: 1
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists for ${branch}: ${existing.data[0].html_url}`);
              return;
            }

            const commits = await github.rest.repos.listCommits({
              owner,
              repo,
              sha: branch,
              per_page: 1
            });

            const latestSubject = commits.data[0]?.commit?.message?.split('\n')[0]?.trim();
            const fallbackTitle = branch.replace(/^[^/]+\//, '').replace(/-/g, ' ');
            const title = latestSubject || `chore(pr): ${fallbackTitle}`;

            let body = "## 变更内容\n\n- 自动创建的 Draft PR，请补充本次改动说明\n";
            if (fs.existsSync('.github/pull_request_template.md')) {
              body = fs.readFileSync('.github/pull_request_template.md', 'utf8');
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body,
              draft: true
            });

            core.info(`Draft PR created: ${pr.data.html_url}`);
