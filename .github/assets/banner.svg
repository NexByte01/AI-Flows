<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="50%" style="stop-color:#0d0d17"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
    
    <!-- Dynamic Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#6c2bd9;stop-opacity:0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="6s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#6c2bd9;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glowBlue" cx="80%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.1;0.3;0.1" dur="7s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.05;0.2;0.05" dur="8s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>

    <!-- Data Line Gradients -->
    <linearGradient id="dataLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c2bd9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#6c2bd9;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dataLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dataLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c4b5fd;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Filter for glow effect on particles -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  
  <!-- Ambient Glows -->
  <rect width="1200" height="300" fill="url(#glowPurple)"/>
  <rect width="1200" height="300" fill="url(#glowBlue)"/>
  <rect width="1200" height="300" fill="url(#glowCenter)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250" />
    <path d="M200,0 L200,300 M400,0 L400,300 M600,0 L600,300 M800,0 L800,300 M1000,0 L1000,300" />
  </g>

  <!-- Network Connections (Faint lines connecting nodes) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <line x1="150" y1="80" x2="280" y2="160" />
    <line x1="280" y1="160" x2="420" y2="120" />
    <line x1="420" y1="120" x2="550" y2="200" />
    
    <line x1="1050" y1="220" x2="920" y2="140" />
    <line x1="920" y1="140" x2="780" y2="180" />
    <line x1="780" y1="180" x2="650" y2="100" />
    
    <line x1="420" y1="120" x2="650" y2="100" opacity="0.5"/>
    <line x1="550" y1="200" x2="780" y2="180" opacity="0.5"/>
  </g>

  <!-- Data Flow Lines (Dashed moving lines) -->
  <g opacity="0.8">
    <!-- Top Left to Right -->
    <line x1="-100" y1="100" x2="600" y2="100" stroke="url(#dataLine1)" stroke-width="2" stroke-dasharray="100 600" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" values="700;-100" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="4s" keyTimes="0;0.5;1" repeatCount="indefinite"/>
    </line>
    
    <!-- Bottom Right to Left -->
    <line x1="1300" y1="200" x2="600" y2="200" stroke="url(#dataLine2)" stroke-width="2" stroke-dasharray="120 700" stroke-dashoffset="-120">
      <animate attributeName="stroke-dashoffset" values="-120;700" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="5s" keyTimes="0;0.5;1" repeatCount="indefinite"/>
    </line>

    <!-- Center Subtle Flow -->
    <line x1="200" y1="150" x2="1000" y2="150" stroke="url(#dataLine3)" stroke-width="1.5" opacity="0.5" stroke-dasharray="20 40" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="60;0" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Floating Nodes -->
  <g filter="url(#blur)">
    <!-- Purple Nodes -->
    <g fill="#c084fc">
      <circle cx="150" cy="80" r="3.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="280" cy="160" r="2.5">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-5; 0,0" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="420" cy="120" r="3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -4,6; 0,0" dur="4.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="550" cy="200" r="2">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Blue Nodes -->
    <g fill="#93c5fd">
      <circle cx="1050" cy="220" r="3.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="920" cy="140" r="2.5">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -5,4; 0,0" dur="5.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="780" cy="180" r="3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 4,-5; 0,0" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="650" cy="100" r="2">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5.8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Typography -->
  <!-- Subtle text shadow for depth -->
  <text x="600" y="132" text-anchor="middle" font-family="'SF Pro Display','Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="76" font-weight="800" fill="#000000" opacity="0.4" letter-spacing="-2">
    AI Flows
  </text>
  <text x="600" y="130" text-anchor="middle" font-family="'SF Pro Display','Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
    AI Flows
  </text>
  
  <text x="600" y="175" text-anchor="middle" font-family="'SF Pro Display','Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="6">
    AI PROJECT OPERATING SYSTEM
  </text>

  <!-- Interactive/Scanning Light Bar at Bottom -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#dataLine2)" opacity="0.7">
    <animate attributeName="x" values="-1200;1200" dur="5s" repeatCount="indefinite" />
  </rect>
  <!-- Scanning Light Bar at Top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#dataLine1)" opacity="0.7">
    <animate attributeName="x" values="1200;-1200" dur="6s" repeatCount="indefinite" />
  </rect>
</svg>
