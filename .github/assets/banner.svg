<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="50%" style="stop-color:#0d0d17"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>

    <!-- Breathing Glows -->
    <radialGradient id="g1" cx="25%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#6c2bd9;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.12;0.35;0.12" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#6c2bd9;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g2" cx="75%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.25">
        <animate attributeName="stop-opacity" values="0.08;0.28;0.08" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.12">
        <animate attributeName="stop-opacity" values="0.04;0.18;0.04" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>

    <!-- Data Pulse Gradients -->
    <linearGradient id="pulse1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#a855f7;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#c084fc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pulse2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#3b82f6;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pulse3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#g1)"/>
  <rect width="1200" height="300" fill="url(#g2)"/>
  <rect width="1200" height="300" fill="url(#g3)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="720" y1="0" x2="720" y2="300"/>
    <line x1="960" y1="0" x2="960" y2="300"/>
  </g>

  <!-- Network Topology Lines -->
  <g stroke="#fff" stroke-width="0.5" opacity="0.08">
    <line x1="120" y1="75" x2="280" y2="150"/>
    <line x1="280" y1="150" x2="440" y2="110"/>
    <line x1="440" y1="110" x2="560" y2="190"/>
    <line x1="1080" y1="225" x2="920" y2="135"/>
    <line x1="920" y1="135" x2="760" y2="175"/>
    <line x1="760" y1="175" x2="640" y2="95"/>
    <line x1="440" y1="110" x2="640" y2="95" opacity="0.5"/>
    <line x1="560" y1="190" x2="760" y2="175" opacity="0.5"/>
  </g>

  <!-- Data Pulse 1: Left → Right (top) -->
  <rect x="-200" y="94" width="200" height="3" rx="1.5" fill="url(#pulse1)" opacity="0.9">
    <animate attributeName="x" values="-200;1400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" keyTimes="0;0.1;0.85;1" repeatCount="indefinite"/>
  </rect>

  <!-- Data Pulse 2: Right → Left (bottom) -->
  <rect x="1400" y="203" width="250" height="3" rx="1.5" fill="url(#pulse2)" opacity="0.8">
    <animate attributeName="x" values="1400;-250" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="5s" keyTimes="0;0.1;0.85;1" repeatCount="indefinite"/>
  </rect>

  <!-- Data Pulse 3: Subtle center flow -->
  <rect x="-150" y="149" width="150" height="2" rx="1" fill="url(#pulse3)" opacity="0.5">
    <animate attributeName="x" values="-150;1350" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="7s" keyTimes="0;0.08;0.88;1" repeatCount="indefinite"/>
  </rect>

  <!-- Data Pulse 4: Fast thin streak -->
  <rect x="1300" y="68" width="100" height="1.5" rx="0.75" fill="url(#pulse1)" opacity="0.4">
    <animate attributeName="x" values="1300;-100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="3s" keyTimes="0;0.15;0.8;1" repeatCount="indefinite"/>
  </rect>

  <!-- Data Pulse 5 -->
  <rect x="-120" y="232" width="120" height="1.5" rx="0.75" fill="url(#pulse2)" opacity="0.35">
    <animate attributeName="x" values="-120;1320" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="6s" keyTimes="0;0.1;0.88;1" repeatCount="indefinite"/>
  </rect>

  <!-- Glowing Nodes (multi-layer circles instead of filter) -->
  <!-- Node 1 - Purple -->
  <circle cx="120" cy="75" r="10" fill="#a855f7" opacity="0.08">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="75" r="5" fill="#a855f7" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="75" r="2.5" fill="#c084fc" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 2 -->
  <circle cx="280" cy="150" r="8" fill="#8b5cf6" opacity="0.06">
    <animate attributeName="opacity" values="0.03;0.1;0.03" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="150" r="4" fill="#8b5cf6" opacity="0.12">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="150" r="2" fill="#c084fc" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 3 -->
  <circle cx="440" cy="110" r="9" fill="#a855f7" opacity="0.07">
    <animate attributeName="opacity" values="0.03;0.11;0.03" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="110" r="4.5" fill="#a855f7" opacity="0.14">
    <animate attributeName="opacity" values="0.07;0.2;0.07" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="110" r="2.5" fill="#e9d5ff" opacity="0.85">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 4 -->
  <circle cx="560" cy="190" r="7" fill="#7c3aed" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.08;0.02" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="190" r="2" fill="#c084fc" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 5 - Blue -->
  <circle cx="1080" cy="225" r="10" fill="#3b82f6" opacity="0.08">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="225" r="5" fill="#3b82f6" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="225" r="2.5" fill="#93c5fd" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 6 -->
  <circle cx="920" cy="135" r="8" fill="#2563eb" opacity="0.06">
    <animate attributeName="opacity" values="0.03;0.1;0.03" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="135" r="4" fill="#2563eb" opacity="0.12">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="135" r="2" fill="#93c5fd" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 7 -->
  <circle cx="760" cy="175" r="9" fill="#3b82f6" opacity="0.07">
    <animate attributeName="opacity" values="0.03;0.11;0.03" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="175" r="4.5" fill="#3b82f6" opacity="0.14">
    <animate attributeName="opacity" values="0.07;0.2;0.07" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="175" r="2.5" fill="#bfdbfe" opacity="0.85">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 8 -->
  <circle cx="640" cy="95" r="7" fill="#1d4ed8" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.08;0.02" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="95" r="2" fill="#93c5fd" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Title Shadow -->
  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="76" font-weight="800" fill="#000" opacity="0.5" letter-spacing="-2">AI Flows</text>
  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="76" font-weight="800" fill="#fff" letter-spacing="-2">AI Flows</text>
  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="6">AI PROJECT OPERATING SYSTEM</text>

  <!-- Divider -->
  <rect x="540" y="198" width="120" height="2" rx="1" fill="#6c2bd9" opacity="0.5">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="100;140;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="550;530;550" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanner Beam Top -->
  <rect y="0" width="300" height="1.5" rx="0.75" fill="url(#pulse1)" opacity="0.6">
    <animate attributeName="x" values="-300;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Scanner Beam Bottom -->
  <rect y="298.5" width="300" height="1.5" rx="0.75" fill="url(#pulse2)" opacity="0.5">
    <animate attributeName="x" values="1200;-300" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
